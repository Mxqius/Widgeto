[package]
name = "widgeto"
version = "0.3.0"
description = "Desktop widgets, always on your screen"
license = "MIT"
repository = "https://github.com/mxqius/widgeto"
edition = "2021"

[lib]
name = "widgeto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls so there is no OpenSSL build dependency
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
sysinfo = "0.39"
starship-battery = "0.11"
# blocks on the WinRT futures without dragging in a full async runtime
pollster = "0.4"

# Reading the current media session is a Windows-only API.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Media",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
