[package]
name = "widgeto"
version = "0.1.0"
description = "Desktop widget board"
authors = ["you"]
edition = "2021"

[lib]
name = "widgeto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls so there is no OpenSSL build dependency
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
sysinfo = "0.39"
starship-battery = "0.11"
# blocks on the WinRT futures without dragging in a full async runtime
pollster = "0.4"

# Reading the current media session is a Windows-only API.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
