name: Release

# Push a tag like v0.1.0 (matching the version in tauri.conf.json) to build the
# Windows installers, sign them for the updater, and publish a GitHub Release
# with the latest.json manifest the in-app updater reads.
#
# The tag's message becomes the release notes, which the app's update dialog
# shows as "what's new" — so write it for users:
#   git tag -a v0.1.1 -m "Faster weather, and the island shows updates"
#
# Needs two repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           the contents of src-tauri/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  that key's password
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # the annotated tag's message, as the release notes
      - id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          body=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          [ -n "$body" ] || body="Bug fixes and improvements."
          {
            echo "body<<NOTES_EOF"
            echo "$body"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Widgeto v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
